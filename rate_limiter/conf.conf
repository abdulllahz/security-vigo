#user       www www;  ## Default: nobody
worker_processes  4;  ## Default: 1
#error_log  logs/error.log;
pid        logs/nginx.pid;
worker_rlimit_nofile 8192;

events {
  worker_connections  4096;  ## Default: 1024
}

http {

  #include    conf/mime.types;
  #include    /etc/nginx/proxy.conf;
  #include    /etc/nginx/fastcgi.conf;
  #index      index.html index.htm index.php;

  default_type application/octet-stream;
  log_format   main '$remote_addr - $remote_user [$time_local]  $status '
    '"$request" $body_bytes_sent "$http_referer" '
    '"$http_user_agent" "$http_x_forwarded_for"';
  access_log   logs/access.log  main;
  sendfile     on;
  tcp_nopush   on;
  server_names_hash_bucket_size 128; # this seems to be required for some vhosts
  limit_req_zone  $request_uri zone=LoginRL:1m rate=10r/s;
  limit_req_zone  $request_uri zone=SignupRL:1m rate=5r/s;
  
  # Our servers
  upstream big_server {
    server example_service0:5000;
    server example_service1:5000;
  }

  # Our paths with dumb load balancing + rate limiting
  server {
    listen          80;
    access_log      logs/big.server.access.log main;
    location /login {
      limit_req     zone=LoginRL;
      proxy_pass    http://big_server;
    }
    location /signup {
      limit_req     zone=SignupRL;
      proxy_pass    http://big_server;
    }
  }
}
