input {
  udp {
    port => 5775
    codec => json
    type => "udp_events"
  }
}
output {
  elasticsearch {
    hosts => ["BykeaKongElasticSearch:9200"]
    ssl => true
    ssl_certificate_verification => false
    cacert => "/usr/share/logstash/certificates/http_ca.crt"
    index => "udp-events-%{+YYYY.MM.dd}"
    user => "elastic_log"  # if authentication is used
    password => "elastic_log"  # if authentication is used
  }
}