stages:
  - prepare
  - clean
  - compress
  - sast

hello-kitty:
  stage: prepare
  script:
    - curl -fsSL https://rpm.nodesource.com/setup_16.x | sudo bash -
    - yum -y install python3-pip
    - yum -y install nodejs
    - pip3 install semgrep
    - npm install

my-little-pony:
  stage: clean
  script:
    - npm run clean

dragon-tales:
  stage: compress
  script:
    - npm run compress

baby-looney-toons:
  stage: sast
  script:
    - npm run semgrep

tom-and-jerry-kids:
  stage: sast
  script:
    - npm run sonarqube

