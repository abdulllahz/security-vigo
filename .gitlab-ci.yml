stages:
  - prepare
  - clean
  - compress
  - sast

hello-kitty:
  stage: prepare
  script:
    - yum install python3-pip
    - yum install npm
    - pip3 install semgrep
    - npm install

my-little-pony:
  stage: clean
  script:
    - npm run clean

dragon-tales:
  stage: compress
  script:
    - npm run compress

baby-looney-toons:
  stage: sast
  script:
    - npm run semgrep

tom-and-jerry-kids:
  stage: sast
  script:
    - npm run sonarqube

